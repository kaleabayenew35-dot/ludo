<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ludo — Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/game-yNQFofVT.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="stylesheet" crossorigin href="/assets/game-BrakdtKY.css">
  <link rel="stylesheet" crossorigin href="/assets/styles-DjbjKZ2C.css">
</head>
<body class="game-page">

  <!-- ── GAME HEADER ── -->
  <header class="game-header">
    <button class="game-back-btn" id="gameBackBtn" type="button">
      ← Back
    </button>
    <div class="game-header-center">
      <span class="game-header-title">🎮 Ludo</span>
      <span class="game-header-id">Game <span id="gameHeaderId">#——</span></span>
    </div>
    <div class="game-header-right">
      <div class="game-header-stat">
        <span class="ghs-label">Timer</span>
        <span class="ghs-val red" id="gameTimer">01:00</span>
      </div>
      <div class="game-header-sep"></div>
      <div class="game-header-stat">
        <span class="ghs-label">Bet</span>
        <span class="ghs-val gold" id="gameBetAmt">$0</span>
      </div>
      <div class="game-header-sep"></div>
      <div class="game-header-stat">
        <span class="ghs-label">Balance</span>
        <span class="ghs-val green" id="gameBalance">$500</span>
      </div>
    </div>
  </header>

  <!-- ── MAIN GAME AREA ── -->
  <div class="game-body">

    <!-- Players sidebar left -->
    <aside class="game-players-panel">
      <div class="gpp-title">Players</div>
      <div id="gamePlayers"></div>
    </aside>

    <!-- Board + controls center -->
    <main class="game-main">
      <div class="board-wrapper">
        <div class="ludo-board" id="ludoBoard" aria-label="Ludo game board"></div>
      </div>

      <!-- Control bar -->
      <div class="game-control-bar">
        <div class="dice-area">
          <div class="dice-scene">
            <div class="dice-cube" id="dice" aria-label="Dice">
              <!-- face 1 (front) -->
              <div class="cube-face cube-face-front">
                <span class="dot dot-c"></span>
              </div>
              <!-- face 2 (top) -->
              <div class="cube-face cube-face-top">
                <span class="dot dot-tr"></span>
                <span class="dot dot-bl"></span>
              </div>
              <!-- face 3 (right) -->
              <div class="cube-face cube-face-right">
                <span class="dot dot-tr"></span>
                <span class="dot dot-c"></span>
                <span class="dot dot-bl"></span>
              </div>
              <!-- face 4 (left) -->
              <div class="cube-face cube-face-left">
                <span class="dot dot-tl"></span>
                <span class="dot dot-tr"></span>
                <span class="dot dot-bl"></span>
                <span class="dot dot-br"></span>
              </div>
              <!-- face 5 (bottom) -->
              <div class="cube-face cube-face-bottom">
                <span class="dot dot-tl"></span>
                <span class="dot dot-tr"></span>
                <span class="dot dot-c"></span>
                <span class="dot dot-bl"></span>
                <span class="dot dot-br"></span>
              </div>
              <!-- face 6 (back) -->
              <div class="cube-face cube-face-back">
                <span class="dot dot-tl"></span>
                <span class="dot dot-tr"></span>
                <span class="dot dot-ml"></span>
                <span class="dot dot-mr"></span>
                <span class="dot dot-bl"></span>
                <span class="dot dot-br"></span>
              </div>
            </div>
          </div>
          <div class="dice-value-label" id="diceValueLabel">Roll!</div>
        </div>
        <div class="gcb-sep"></div>
        <div class="turn-display" id="turnDisplay">
          <div class="turn-dot red" id="turnDot"></div>
          <span id="turnText">Red's Turn</span>
        </div>
        <div class="gcb-sep"></div>
        <div class="gcb-log" id="gameLog">
          <div class="log-entry">Game ready — press Start.</div>
        </div>
        <div class="gcb-sep"></div>
        <div class="gcb-actions">
          <button class="btn-primary gcb-btn" id="startGameBtn">▶ Start</button>
          <button class="btn-primary gcb-btn" id="rollDiceBtn" disabled>🎲 Roll</button>
          <button class="btn-ghost gcb-btn" id="forfeitBtn">✗ Forfeit</button>
        </div>
      </div>
    </main>

  </div>

  <!-- ── MODALS ── -->

  <!-- Win -->
  <div class="overlay" id="winModal" aria-hidden="true">
    <div class="modal-box celebration">
      <button class="result-close" id="winCloseBtn" type="button" aria-label="Close result">✕</button>
      <div class="confetti-burst" id="confettiBurst"></div>
      <div class="trophy-emoji">🏆</div>
      <h2 class="gradient-text">You Win!</h2>
      <p id="winMsg">You earned $20!</p>
      <div class="ludo-prize win"><span>🏆 You Win</span><strong id="winAmount">+0 ETB</strong></div>
      <div class="result-countdown"><span id="winCountdownText">Closing in 3s</span><i><b id="winCountdownBar"></b></i></div>
      <button class="btn-primary" id="winContinueBtn">Collect &amp; Go Back</button>
    </div>
  </div>

  <!-- Lose -->
  <div class="overlay" id="loseModal" aria-hidden="true">
    <div class="modal-box">
      <button class="result-close" id="loseCloseBtn" type="button" aria-label="Close result">✕</button>
      <div class="skull-emoji">💀</div>
      <h2>Game Over</h2>
      <p id="loseMsg">Better luck next time!</p>
      <div class="ludo-prize lose"><span>💸 You Lost</span><strong id="loseAmount">−0 ETB</strong></div>
      <div class="result-countdown"><span id="loseCountdownText">Closing in 3s</span><i><b id="loseCountdownBar"></b></i></div>
      <button class="btn-primary" id="loseContinueBtn">Try Again</button>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
</body>
</html>
